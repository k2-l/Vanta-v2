[anthropic]
base_url = "https://api.deepseek.com/anthropic"

[server]
host      = "127.0.0.1"
port      = 8765
log_level = "INFO"
cors_origins = [
    "http://localhost:5173",
    "http://127.0.0.1:5173",
    "tauri://localhost",
    "https://tauri.localhost",
    "http://tauri.localhost"
]

[auth]
# 凭据只通过 HARNESS_AUTH_PASSWORD / HARNESS_AUTH_SECRET 环境变量提供，禁止提交。
token_ttl_hours  = 4
access_token_ttl_minutes = 60
login_rate_limit = 5

[models]
high = "deepseek-flash"
mid  = "deepseek-flash"
low  = "deepseek-flash"

[database]
url = "postgresql+asyncpg://harness:harness_dev@localhost/harness"

[paths]
data_dir     = "data"
profile_path = "data/profile.md"
suite_dir    = "workspace"

[context]
enable_prompt_cache = false

[limits]
tool_concurrency = 5

[embedding]
base_url = "https://ai.gitee.com/v1"
model = "Qwen3-Embedding-8B"

[rerank]
enabled = false
model = "bge-reranker-v2-m3"
recall_n = 20

[permissions]
# ask 决策的审批方：audit_agent = 用 model_low(deepseek-flash) 自动裁决，
# 默认放行常规操作、只拦破坏性动作(rm -rf 等)、fail-closed；替代阻塞式人工审批。
reviewer = "audit_agent"
