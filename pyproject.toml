[project]
name = "harness"
version = "0.1.0"
description = "Personal AI Agent — Supervisor + Worker + Critic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "anthropic>=0.39",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    # M2: 持久化 + 长期记忆
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    # 鉴权
    "pyjwt>=2.9",
    "cryptography>=44.0",  # 密钥库（0.5）：engagement 凭据 Fernet 加密存储
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-anthropic>=1.4.3",
    "langchain-core>=1.3.3",
    "tiktoken>=0.12.0",
    "redis[asyncio]>=7.4.0",
    "qdrant-client>=1.18.0",
    "httpx-ws>=0.9.0",
    "scikit-learn>=1.8.0",
    # 语义检索：embedding + ReRank 均走 Gitee AI 云端 API（httpx 调用），无本地推理依赖
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
harness-api = "harness.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
